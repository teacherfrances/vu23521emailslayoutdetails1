<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session 3 Revision Part 1: Emails, Layout and Details</title>
<style>
:root{
  --navy:#0b2e4f;
  --teal:#0f7d7d;
  --teal-dark:#0b5f5f;
  --amber:#c97a1a;
  --amber-tint:#fdf3e0;
  --teal-tint:#e4f2f2;
  --green:#1c7a3e;
  --green-tint:#e7f4ec;
  --red:#b3261e;
  --red-tint:#fbeceb;
  --cream:#f6f2ea;
  --card:#ffffff;
  --line:#e3ddd0;
  --grey:#5a6672;
  --focus:#1a73b8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--navy);
  font-family:"Segoe UI",Calibri,Arial,sans-serif;
  font-size:19px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
body.big{font-size:23px;}
button{font-family:inherit;font-size:1em;cursor:pointer;}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}

/* ---------- top bar ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  background:var(--navy);color:#fff;
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;flex-wrap:wrap;
}
.tb-btn{
  min-height:44px;min-width:44px;
  background:rgba(255,255,255,.12);color:#fff;
  border:2px solid rgba(255,255,255,.35);
  border-radius:999px;padding:6px 16px;font-weight:600;
}
.tb-btn:hover{background:rgba(255,255,255,.24);}
.tb-title{
  flex:1 1 160px;font-weight:700;font-size:1.02em;
  color:#f6d9ae;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.counter{
  background:#fff;color:var(--navy);
  border-radius:999px;padding:6px 14px;font-weight:700;
  font-family:Consolas,"Courier New",monospace;
  min-height:36px;display:flex;align-items:center;
}

/* ---------- layout ---------- */
.wrap{max-width:900px;margin:0 auto;padding:88px 16px 108px;}
.navbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:#fff;border-top:2px solid var(--line);
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
}
.nav-tip{flex:1 1 auto;color:var(--grey);font-size:.86em;}
.nav-btn{
  min-height:44px;border-radius:999px;padding:8px 22px;
  border:2px solid var(--teal);background:#fff;color:var(--teal-dark);font-weight:700;
}
.nav-btn.primary{background:var(--teal);color:#fff;}
.nav-btn[disabled]{opacity:.4;cursor:not-allowed;}

/* ---------- menu ---------- */
.hero{margin-bottom:22px;}
.eyebrow{
  color:var(--amber);font-weight:700;letter-spacing:2px;
  text-transform:uppercase;font-size:.72em;margin-bottom:6px;
}
h1{font-size:1.7em;margin:0 0 8px;line-height:1.2;}
.sub{color:var(--grey);margin:0 0 4px;}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.mcard{
  text-align:left;background:var(--card);border:2px solid var(--line);
  border-radius:16px;padding:16px;display:flex;gap:12px;align-items:flex-start;
  width:100%;min-height:44px;
}
.mcard:hover{border-color:var(--teal);}
.mcard .ic{font-size:1.6em;line-height:1;}
.mcard .step{
  color:var(--amber);font-weight:700;font-size:.72em;
  letter-spacing:1.4px;text-transform:uppercase;
}
.mcard .mt{font-weight:700;display:block;margin:2px 0 4px;}
.mcard .md{color:var(--grey);font-size:.88em;display:block;}
.mcard .sc{
  margin-top:8px;display:inline-block;font-size:.8em;font-weight:700;
  background:var(--teal-tint);color:var(--teal-dark);
  border-radius:999px;padding:3px 12px;
}
.mcard.done{border-color:var(--green);}
.mcard.done .sc{background:var(--green-tint);color:var(--green);}

/* ---------- round header ---------- */
.rhead{
  background:var(--navy);color:#fff;border-radius:16px;
  padding:16px 18px;margin-bottom:16px;
}
.rhead h2{margin:0 0 6px;font-size:1.22em;}
.rhead p{margin:0;color:#dbe7f0;font-size:.92em;}
.live{
  display:inline-block;margin-top:10px;background:#fff;color:var(--navy);
  border-radius:999px;padding:4px 14px;font-weight:700;font-size:.86em;
  font-family:Consolas,"Courier New",monospace;
}

/* ---------- item card ---------- */
.card{
  background:var(--card);border:2px solid var(--line);border-radius:16px;
  padding:16px;margin-bottom:14px;
}
.chead{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.num{
  background:var(--navy);color:#fff;border-radius:10px;
  min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.9em;
}
.tag{
  background:var(--amber-tint);color:var(--amber);border:1px solid #eccf9f;
  border-radius:999px;padding:2px 12px;font-size:.74em;font-weight:700;
  letter-spacing:.6px;text-transform:uppercase;
}
.q{font-weight:600;margin:6px 0 12px;}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{
  text-align:left;background:#fff;border:2px solid var(--line);
  border-radius:999px;padding:11px 18px;min-height:44px;color:var(--navy);
}
.opt:hover{border-color:var(--teal);}
.opt.right{background:var(--green-tint);border-color:var(--green);font-weight:700;}
.opt.wrong{background:var(--red-tint);border-color:var(--red);}
.opt[disabled]{cursor:default;}
.opt.dim{opacity:.55;}
.fb{border-radius:12px;padding:11px 14px;margin-top:12px;font-size:.94em;}
.fb.good{background:var(--green-tint);border:2px solid var(--green);}
.fb.bad{background:var(--red-tint);border:2px solid var(--red);}
.fb.info{background:var(--teal-tint);border:2px solid var(--teal);}
.fb b{display:block;margin-bottom:2px;}
.hintbtn{
  background:#fff;border:2px solid var(--teal);color:var(--teal-dark);
  border-radius:999px;width:44px;height:44px;font-weight:800;
}
.hintbox{
  background:var(--teal-tint);border:2px solid var(--teal);border-radius:12px;
  padding:10px 14px;margin-top:10px;font-size:.92em;
}
.checkbtn{
  background:var(--teal);color:#fff;border:2px solid var(--teal);
  border-radius:999px;padding:10px 24px;min-height:44px;font-weight:700;margin-top:12px;
}
.retry{
  background:#fff;border:2px solid var(--amber);color:var(--amber);
  border-radius:999px;padding:10px 22px;min-height:44px;font-weight:700;margin:6px 0 4px;
}

/* ---------- mockups ---------- */
.mock{margin:12px 0;font-size:.94em;}
.em{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;}
.em-bar{background:var(--navy);color:#fff;padding:8px 14px;font-weight:700;font-size:.84em;letter-spacing:1px;}
.em-row{display:flex;border-bottom:1px solid var(--line);}
.em-lab{
  background:#f5f7f9;color:var(--grey);font-weight:700;font-size:.82em;
  padding:8px 10px;min-width:88px;border-right:1px solid var(--line);
}
.em-val{padding:8px 10px;flex:1;word-break:break-word;}
.em-body{padding:14px;}
.em-body p{margin:0 0 9px;}
.em-body p:last-child{margin-bottom:0;}

.sms{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;max-width:460px;}
.sms-bar{background:var(--navy);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;}
.av{width:38px;height:38px;border-radius:50%;background:var(--teal);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.86em;}
.av.biz{background:var(--amber);}
.sms-name{font-weight:700;font-size:.92em;}
.sms-sub{font-size:.74em;color:#cddced;}
.sms-body{padding:12px;background:#eef1f4;}
.bub{background:#fff;border-radius:14px;padding:10px 13px;margin-bottom:8px;max-width:88%;
  border:1px solid var(--line);}
.bub.me{background:var(--teal);color:#fff;margin-left:auto;border-color:var(--teal);}
.bub .tm{display:block;font-size:.72em;color:var(--grey);margin-top:4px;}
.bub.me .tm{color:#d7efef;}

.notice{border:3px solid var(--amber);background:var(--amber-tint);border-radius:12px;padding:16px;text-align:center;}
.notice h4{margin:0 0 8px;font-size:1.06em;letter-spacing:1px;text-transform:uppercase;}
.notice p{margin:0 0 6px;}
.notice .sig{font-size:.84em;color:var(--grey);margin-top:10px;}

.doc{border:2px solid var(--line);border-radius:12px;background:#fff;padding:14px;}
.doc .biz{font-weight:700;font-size:1.04em;}
.doc .meta{color:var(--grey);font-size:.84em;margin-bottom:10px;}
.doc table{width:100%;border-collapse:collapse;margin-bottom:8px;}
.doc td{border-bottom:1px solid var(--line);padding:6px 4px;}
.doc td.r{text-align:right;font-family:Consolas,"Courier New",monospace;}
.doc .tot{font-weight:700;}
.doc .stamp{
  display:inline-block;margin-top:8px;border:2px solid var(--green);color:var(--green);
  border-radius:8px;padding:3px 12px;font-weight:700;font-size:.82em;letter-spacing:1px;}
.doc .due{
  display:inline-block;margin-top:8px;border:2px solid var(--red);color:var(--red);
  border-radius:8px;padding:3px 12px;font-weight:700;font-size:.82em;letter-spacing:1px;}

.form{border:2px solid var(--line);border-radius:12px;background:#fff;padding:14px;}
.form h4{margin:0 0 10px;font-size:1.02em;}
.form .frow{display:flex;gap:8px;align-items:center;margin-bottom:9px;font-size:.94em;}
.form .flab{min-width:118px;color:var(--grey);font-weight:700;font-size:.86em;}
.form .fbox{flex:1;border:1px solid var(--grey);border-radius:6px;padding:6px 8px;background:#fbfbfb;min-height:30px;}
.form .tick{width:20px;height:20px;border:2px solid var(--navy);border-radius:4px;display:inline-block;}

.notif{background:#1c2430;color:#fff;border-radius:16px;padding:14px;max-width:420px;}
.notif .app{font-size:.78em;color:#9fb3c8;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.notif .nt{font-weight:700;margin-bottom:4px;}
.notif .tm{font-size:.76em;color:#9fb3c8;margin-top:6px;}

.signwrap{display:flex;justify-content:center;padding:6px 0;}
.sign{
  width:170px;height:170px;border-radius:50%;border:14px solid var(--red);
  background:#fff;display:flex;align-items:center;justify-content:center;
  text-align:center;font-weight:800;padding:14px;line-height:1.2;
}

/* ---------- match ---------- */
.matchwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:560px){.matchwrap{grid-template-columns:1fr;}}
.mcol h4{margin:0 0 8px;font-size:.82em;letter-spacing:1px;text-transform:uppercase;color:var(--grey);}
.mbtn{
  display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);
  border-radius:12px;padding:11px 14px;margin-bottom:9px;min-height:44px;color:var(--navy);
}
.mbtn:hover{border-color:var(--teal);}
.mbtn.sel{border-color:var(--amber);background:var(--amber-tint);font-weight:700;}
.mbtn.paired{background:var(--green-tint);border-color:var(--green);opacity:.75;cursor:default;}
.mbtn.miss{background:var(--red-tint);border-color:var(--red);}

/* ---------- chips ---------- */
.chipline{margin-bottom:6px;}
.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px;}
.chip{
  background:#fff;border:2px solid var(--line);border-radius:999px;
  padding:9px 22px;min-height:44px;min-width:74px;font-weight:700;color:var(--navy);
}
.chip:hover{border-color:var(--teal);}
.chip.right{background:var(--green-tint);border-color:var(--green);}
.chip.wrong{background:var(--red-tint);border-color:var(--red);}

/* ---------- word bank ---------- */
.bank{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0 16px;}
.bw{
  background:#fff;border:2px solid var(--teal);color:var(--teal-dark);
  border-radius:999px;padding:8px 18px;min-height:44px;font-weight:700;
}
.bw.used{opacity:.35;cursor:default;}
.gaptext p{margin:0 0 10px;}
.gap{
  display:inline-block;min-width:120px;min-height:44px;
  border:2px dashed var(--grey);border-radius:10px;background:#fff;
  padding:6px 12px;font-weight:700;color:var(--navy);vertical-align:middle;
}
.gap.sel{border-style:solid;border-color:var(--amber);background:var(--amber-tint);}
.gap.right{border-style:solid;border-color:var(--green);background:var(--green-tint);}
.gap.wrong{border-style:solid;border-color:var(--red);background:var(--red-tint);}

/* ---------- typed ---------- */
.ansrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.tin{
  flex:1 1 210px;min-height:44px;font-family:inherit;font-size:1em;
  border:2px solid var(--line);border-radius:12px;padding:9px 14px;background:#fff;color:var(--navy);
}
.tin:focus{border-color:var(--teal);}
.tin.right{border-color:var(--green);background:var(--green-tint);}
.tin.wrong{border-color:var(--red);background:var(--red-tint);}
.mini{
  background:var(--teal);color:#fff;border:2px solid var(--teal);
  border-radius:999px;padding:8px 20px;min-height:44px;font-weight:700;
}

/* ---------- sort ---------- */
.sortcard{
  background:#fff;border:2px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:12px;font-weight:600;
}
.bins{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
.bin{
  flex:1 1 180px;min-height:44px;border-radius:999px;padding:11px 16px;font-weight:700;
  border:2px solid var(--navy);background:#fff;color:var(--navy);
}
.bin:hover{background:var(--teal-tint);}
.left{color:var(--grey);font-size:.86em;margin-bottom:8px;}

/* ---------- order ---------- */
.slots{border:2px solid var(--line);border-radius:14px;background:#fff;padding:12px;margin-bottom:12px;}
.slot{
  border:2px dashed var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;
  min-height:44px;color:var(--grey);font-size:.94em;display:flex;align-items:center;gap:10px;
}
.slot .sn{font-weight:700;color:var(--navy);min-width:22px;}
.slot.filled{border-style:solid;border-color:var(--green);background:var(--green-tint);color:var(--navy);}
.slot.bad{border-style:solid;border-color:var(--red);background:var(--red-tint);color:var(--navy);}
.pool{display:flex;flex-direction:column;gap:9px;}
.pline{
  text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;
  padding:11px 14px;min-height:44px;color:var(--navy);
}
.pline:hover{border-color:var(--teal);}
.pline.used{display:none;}

/* ---------- hotspot ---------- */
.lines{border:2px solid var(--line);border-radius:14px;background:#fff;padding:10px;}
.hline{
  display:block;width:100%;text-align:left;background:#fff;border:2px solid transparent;
  border-bottom:1px solid var(--line);padding:11px 12px;min-height:44px;color:var(--navy);
}
.hline:last-child{border-bottom:2px solid transparent;}
.hline:hover{background:#f5f7f9;}
.hline.pick{background:var(--amber-tint);border-color:var(--amber);border-radius:10px;}
.hline.ok{background:var(--green-tint);border-color:var(--green);border-radius:10px;}
.hline.no{background:var(--red-tint);border-color:var(--red);border-radius:10px;}

/* ---------- tap the part ---------- */
.tp{
  display:inline-block;min-height:44px;min-width:44px;
  border:2px dashed #c3ccd6;border-radius:10px;background:#fff;color:var(--navy);
  padding:8px 10px;text-align:left;font:inherit;line-height:1.35;
}
.tp:hover{border-color:var(--teal);}
.tp.found{border-style:solid;border-color:var(--green);background:var(--green-tint);font-weight:700;}
.tp.no{border-style:solid;border-color:var(--red);background:var(--red-tint);}
.tpbody p{margin:0 0 10px;}
.namebox b{display:block;margin-bottom:4px;}
.namebox span{display:inline-block;background:#fff;border:1px solid var(--teal);color:var(--teal-dark);
  border-radius:999px;padding:2px 12px;margin:3px 6px 3px 0;font-weight:600;font-size:.9em;}

/* ---------- results ---------- */
.res{background:#fff;border:2px solid var(--line);border-radius:18px;padding:22px;text-align:center;}
.big{font-size:2.6em;font-weight:800;color:var(--teal);font-family:Consolas,"Courier New",monospace;}
.stars{font-size:1.7em;letter-spacing:4px;margin:6px 0;}
.brk{margin-top:18px;text-align:left;}
.brow{display:flex;gap:10px;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);padding:9px 2px;}
.brow .bn{font-weight:600;}
.brow .bv{font-family:Consolas,"Courier New",monospace;font-weight:700;}
.brow.weak .bv{color:var(--red);}
.brow.strong .bv{color:var(--green);}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;}
}
@media(max-width:420px){
  .wrap{padding:96px 10px 108px;}
  .tb-title{flex-basis:100%;order:5;}
}
</style>
</head>
<body>

<div class="topbar">
  <button class="tb-btn" id="menuBtn">Menu</button>
  <span class="tb-title" id="barTitle">Session 3 Revision Part 1</span>
  <span class="counter" id="counter">0 / 0</span>
  <button class="tb-btn" id="bigBtn">Bigger text</button>
  <button class="tb-btn" id="fsBtn">Full screen</button>
</div>

<main class="wrap" id="main"></main>

<div class="navbar">
  <span class="nav-tip" id="navTip">Choose a part to begin.</span>
  <button class="nav-btn" id="backBtn">Back</button>
  <button class="nav-btn primary" id="nextBtn">Next</button>
</div>

<script>
/* ============================================================
   MOCKUP BUILDERS
   ============================================================ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function mockEmail(o){
  var rows='';
  rows+='<div class="em-row"><div class="em-lab">From</div><div class="em-val">'+esc(o.from)+'</div></div>';
  if(o.to){rows+='<div class="em-row"><div class="em-lab">To</div><div class="em-val">'+esc(o.to)+'</div></div>';}
  rows+='<div class="em-row"><div class="em-lab">Subject</div><div class="em-val">'+esc(o.subject)+'</div></div>';
  if(o.date){rows+='<div class="em-row"><div class="em-lab">Date</div><div class="em-val">'+esc(o.date)+'</div></div>';}
  var body=o.body.map(function(p){return '<p>'+esc(p)+'</p>';}).join('');
  return '<div class="mock"><div class="em"><div class="em-bar">'+esc(o.box||'INBOX')+'</div>'+rows+
         '<div class="em-body">'+body+'</div></div></div>';
}

function mockSms(o){
  var b=o.msgs.map(function(m){
    return '<div class="bub'+(m.me?' me':'')+'">'+esc(m.text)+'<span class="tm">'+esc(m.time||'')+'</span></div>';
  }).join('');
  return '<div class="mock"><div class="sms"><div class="sms-bar">'+
    '<span class="av'+(o.biz?' biz':'')+'">'+esc(o.initials)+'</span>'+
    '<span><span class="sms-name">'+esc(o.name)+'</span><br><span class="sms-sub">'+esc(o.sub||'')+'</span></span>'+
    '</div><div class="sms-body">'+b+'</div></div></div>';
}

function mockNotice(o){
  var p=o.lines.map(function(l){return '<p>'+esc(l)+'</p>';}).join('');
  return '<div class="mock"><div class="notice"><h4>'+esc(o.title)+'</h4>'+p+
    (o.sign?'<div class="sig">'+esc(o.sign)+'</div>':'')+'</div></div>';
}

function mockDoc(o){
  var rows=o.rows.map(function(r){
    return '<tr><td>'+esc(r[0])+'</td><td class="r">'+esc(r[1])+'</td></tr>';
  }).join('');
  var tot='<tr><td class="tot">'+esc(o.totalLabel||'Total')+'</td><td class="r tot">'+esc(o.total)+'</td></tr>';
  var stamp=o.paid?'<span class="stamp">PAID</span>':'<span class="due">PLEASE PAY BY '+esc(o.due)+'</span>';
  return '<div class="mock"><div class="doc"><div class="biz">'+esc(o.biz)+'</div>'+
    '<div class="meta">'+esc(o.meta)+'</div><table>'+rows+tot+'</table>'+stamp+'</div></div>';
}

function mockForm(o){
  var f=o.fields.map(function(x){
    return '<div class="frow"><span class="flab">'+esc(x[0])+'</span><span class="fbox">'+esc(x[1]||'')+'</span></div>';
  }).join('');
  return '<div class="mock"><div class="form"><h4>'+esc(o.title)+'</h4>'+f+
    '<div class="frow"><span class="tick"></span>&nbsp;'+esc(o.tick)+'</div></div></div>';
}

function mockNotif(o){
  return '<div class="mock"><div class="notif"><div class="app">'+esc(o.app)+'</div>'+
    '<div class="nt">'+esc(o.title)+'</div><div>'+esc(o.text)+'</div>'+
    '<div class="tm">'+esc(o.time)+'</div></div></div>';
}

function mockSign(o){
  return '<div class="mock"><div class="signwrap"><div class="sign">'+esc(o.text)+'</div></div></div>';
}

/* ============================================================
   ROUND CONTENT
   ============================================================ */

var TOTAL = ROUNDS.reduce(function(s,r){return s+r.total;},0);

var state = {view:'menu', res:{}};

var main    = document.getElementById('main');
var barTitle= document.getElementById('barTitle');
var counter = document.getElementById('counter');
var navTip  = document.getElementById('navTip');
var backBtn = document.getElementById('backBtn');
var nextBtn = document.getElementById('nextBtn');

function key(r,i){return 'r'+r+'-'+i;}
function record(r,i,ok){ state.res[key(r,i)] = !!ok; updateCounter(); }
function has(r,i){ return Object.prototype.hasOwnProperty.call(state.res,key(r,i)); }
function roundStats(n){
  var rd = ROUNDS[n-1], done=0, right=0;
  for(var i=0;i<rd.total;i++){ if(has(n,i)){ done++; if(state.res[key(n,i)]) right++; } }
  return {done:done, right:right, total:rd.total};
}
function clearRound(n){
  var rd = ROUNDS[n-1];
  for(var i=0;i<rd.total;i++){ delete state.res[key(n,i)]; }
  updateCounter();
}
function answeredAll(){ return Object.keys(state.res).length; }
function rightAll(){
  var c=0; for(var k in state.res){ if(state.res[k]) c++; } return c;
}
function updateCounter(){
  counter.textContent = answeredAll()+' / '+TOTAL;
  if(typeof state.view === 'number'){
    var st = roundStats(state.view);
    var live = document.getElementById('liveScore');
    if(live){ live.textContent = 'This part: '+st.right+' correct out of '+st.done+' answered'; }
  }
  var mc = document.getElementById('menuCards');
  if(mc){ paintMenuCards(); }
}

function el(html){
  var d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstChild;
}

/* ---------- router ---------- */
function go(v){ state.view = v; window.scrollTo(0,0); render(); }

function render(){
  main.innerHTML = '';
  if(state.view === 'menu'){ renderMenu(); }
  else if(state.view === 'results'){ renderResults(); }
  else { renderRound(state.view); }
  updateNav();
  updateCounter();
}

function updateNav(){
  var v = state.view;
  if(v === 'menu'){
    barTitle.textContent = 'Session 3 Revision Part 1';
    backBtn.disabled = true;
    nextBtn.disabled = false;
    nextBtn.textContent = 'Start part 1';
    navTip.textContent = 'Choose any part. You can do them in any order.';
  } else if(v === 'results'){
    barTitle.textContent = 'Your results';
    backBtn.disabled = false;
    nextBtn.disabled = false;
    nextBtn.textContent = 'Menu';
    navTip.textContent = 'Go back to any part to try it again.';
  } else {
    var rd = ROUNDS[v-1];
    barTitle.textContent = 'Part '+rd.n+': '+rd.title;
    backBtn.disabled = false;
    nextBtn.disabled = false;
    nextBtn.textContent = (v === ROUNDS.length) ? 'See results' : 'Next part';
    navTip.textContent = rd.style;
  }
}

backBtn.onclick = function(){
  var v = state.view;
  if(v === 'results'){ go(ROUNDS.length); }
  else if(typeof v === 'number'){ go(v === 1 ? 'menu' : v-1); }
};
nextBtn.onclick = function(){
  var v = state.view;
  if(v === 'menu'){ go(1); }
  else if(v === 'results'){ go('menu'); }
  else if(v === ROUNDS.length){ go('results'); }
  else { go(v+1); }
};
document.getElementById('menuBtn').onclick = function(){ go('menu'); };
document.getElementById('bigBtn').onclick = function(){
  document.body.classList.toggle('big');
  this.textContent = document.body.classList.contains('big') ? 'Normal text' : 'Bigger text';
};
document.getElementById('fsBtn').onclick = function(){
  if(document.fullscreenElement){ document.exitFullscreen(); }
  else if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen(); }
};
document.addEventListener('keydown', function(e){
  var t = e.target && e.target.tagName;
  if(t === 'INPUT' || t === 'TEXTAREA') return;
  if(e.key === 'Escape'){ go('menu'); }
  else if(e.key === 'ArrowRight'){ nextBtn.click(); }
  else if(e.key === 'ArrowLeft'){ if(!backBtn.disabled) backBtn.click(); }
});

    b.innerHTML = '<span class="ic">'+rd.ic+'</span><span><span class="step">Part '+rd.n+' &middot; '+rd.style+'</span>'+
      '<span class="mt">'+rd.title+'</span><span class="md">'+rd.desc+'</span>'+
      '<span class="sc" data-score="'+rd.n+'"></span></span>';
    b.onclick = function(){ go(rd.n); };
    grid.appendChild(b);
  });
  main.appendChild(grid);
  var rbtn = el('<button class="retry" style="margin-top:16px">See my results</button>');
  rbtn.onclick = function(){ go('results'); };
  main.appendChild(rbtn);
  paintMenuCards();
}
function paintMenuCards(){
  ROUNDS.forEach(function(rd){
    var s = roundStats(rd.n);
    var sp = document.querySelector('[data-score="'+rd.n+'"]');
    if(!sp) return;
    sp.textContent = s.done ? (s.right+' / '+s.total+' correct') : (s.total+' questions');
    var card = sp.closest('.mcard');
    if(card){ card.classList.toggle('done', s.done === s.total); }
  });
}

/* ---------- round frame ---------- */
function renderRound(n){
  var rd = ROUNDS[n-1];
  main.appendChild(el(
    '<div class="rhead"><h2>Part '+rd.n+': '+rd.title+'</h2><p>'+rd.desc+'</p>'+
    '<span class="live" id="liveScore">This part: 0 correct out of 0 answered</span></div>'));
  var body = document.createElement('div');
  body.id = 'roundBody';
  main.appendChild(body);
  rd.build(body, n);
  var again = el('<button class="retry">Try this part again</button>');
  again.onclick = function(){ clearRound(n); go(n); };
  main.appendChild(again);
}

/* ---------- shared card helpers ---------- */
function cardShell(num, tag, inner){
  return el('<div class="card"><div class="chead"><span class="num">'+num+'</span>'+
    '<span class="tag">'+tag+'</span></div>'+inner+'</div>');
}
function feedback(node, ok, why){
  var old = node.querySelector('.fb');
  if(old) old.remove();
  var f = el('<div class="fb '+(ok?'good':'bad')+'"><b>'+(ok?'Correct.':'Not this time.')+'</b>'+why+'</div>');
  node.appendChild(f);
}

/* ---------- 1. MATCH ---------- */
function buildMatch(root, n){
  var wOrder = [3,5,0,2,4,1];
  var mOrder = [4,2,1,5,0,3];
  var wrap = el('<div class="card"><div class="chead"><span class="tag">Tap a word, then tap its meaning</span></div>'+
    '<div class="matchwrap"><div class="mcol" id="colW"><h4>Word</h4></div>'+
    '<div class="mcol" id="colM"><h4>Meaning</h4></div></div></div>');
  root.appendChild(wrap);
  var colW = wrap.querySelector('#colW'), colM = wrap.querySelector('#colM');
  var sel = null, tried = {};
  wOrder.forEach(function(i){
    var b = el('<button class="mbtn" data-i="'+i+'">'+R1[i].w+'</button>');
    b.onclick = function(){
      if(b.classList.contains('paired')) return;
      colW.querySelectorAll('.mbtn').forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel'); sel = b;
    };
    colW.appendChild(b);
  });
  mOrder.forEach(function(i){
    var b = el('<button class="mbtn" data-i="'+i+'">'+R1[i].m+'</button>');
    b.onclick = function(){
      if(!sel || b.classList.contains('paired')) return;
      var wi = parseInt(sel.dataset.i,10), mi = i;
      if(wi === mi){
        sel.classList.remove('sel'); sel.classList.add('paired');
        b.classList.add('paired');
        record(n, wi, tried[wi] !== true);
        sel = null;
      } else {
        tried[wi] = true;
        sel.classList.add('miss'); b.classList.add('miss');
        var s = sel;
        setTimeout(function(){ s.classList.remove('miss'); b.classList.remove('miss'); }, 700);
      }
    };
    colM.appendChild(b);
  });
}

/* ---------- generic MCQ list ---------- */
function mcqCards(root, n, items, offset, tag){
  items.forEach(function(it, idx){
    var i = offset + idx;
    var inner = (it.mock || '') + '<p class="q">'+it.q+'</p><div class="opts"></div>';
    var card = cardShell(i+1, tag, inner);
    var opts = card.querySelector('.opts');
    it.opts.forEach(function(o, oi){
      var b = el('<button class="opt"></button>');
      b.textContent = o;
      b.onclick = function(){
        if(card.dataset.done) return;
        card.dataset.done = '1';
        var ok = (oi === it.a);
        b.classList.add(ok ? 'right' : 'wrong');
        opts.querySelectorAll('.opt').forEach(function(x, xi){
          x.disabled = true;
          if(xi === it.a) x.classList.add('right');
          if(!x.classList.contains('right') && x !== b) x.classList.add('dim');
        });
        record(n, i, ok);
        feedback(card, ok, it.why);
      };
      opts.appendChild(b);
    });
    root.appendChild(card);
  });
}

/* ---------- 2. TEXT TYPE ---------- */
function buildTypeId(root, n){
  root.appendChild(el('<div class="fb info" style="margin:0 0 14px"><b>Before you start</b>'+
    'Ask yourself three questions each time. Who wrote it? Who is it for, one person or everybody? '+
    'Does it have a subject line, a greeting and a closing?</div>'));
  mcqCards(root, n, R2, 0, 'What is it?');
}

/* ---------- 3. EMAIL LAYOUT AND PART NAMES ---------- */
function buildLayout(root, n){
  root.appendChild(el('<div class="fb info namebox" style="margin:0 0 14px"><b>The names we use for the parts of an email</b>'+
    '<span>sender</span><span>receiver</span><span>subject line</span><span>greeting</span><span>body</span>'+
    '<span>closing</span><span>signature</span><span>attachment</span><span>emoji</span><span>reference number</span></div>'));

  /* --- item 0: build the email in order --- */
  var card = el('<div class="card"><div class="chead"><span class="num">1</span>'+
    '<span class="tag">Put it in order</span></div>'+
    '<p class="q">Tap the seven lines in the correct order. Each empty box tells you which part goes there.</p>'+
    '<div class="slots" id="slots"></div><div class="pool" id="pool"></div></div>');
  root.appendChild(card);
  var slots = card.querySelector('#slots'), pool = card.querySelector('#pool');
  var pos = 0, slipped = false;

  function reset(){
    pos = 0; slipped = false;
    slots.innerHTML=''; pool.innerHTML='';
    R3_LINES.forEach(function(l, i){
      slots.appendChild(el('<div class="slot" data-s="'+i+'"><span class="sn">'+(i+1)+'</span><span>'+l.p+'</span></div>'));
    });
    R3_POOL_ORDER.forEach(function(i){
      var b = el('<button class="pline" data-i="'+i+'"></button>');
      b.textContent = R3_LINES[i].t;
      b.onclick = function(){
        if(pos >= R3_LINES.length) return;
        var slot = slots.querySelector('[data-s="'+pos+'"]');
        if(i === pos){
          slot.classList.add('filled');
          slot.innerHTML = '<span class="sn">'+(pos+1)+'</span><span><b>'+R3_LINES[i].p+':</b> '+esc(R3_LINES[i].t)+'</span>';
          b.classList.add('used');
          pos++;
          if(pos === R3_LINES.length){
            record(n, 0, !slipped);
            feedback(card, !slipped, slipped
              ? 'The email is built now. Sender, receiver, subject line, greeting, body, closing, signature.'
              : 'Every line in the right place first time. Sender, receiver, subject line, greeting, body, closing, signature.');
          }
        } else {
          slipped = true;
          slot.classList.add('bad');
          setTimeout(function(){ slot.classList.remove('bad'); }, 600);
        }
      };
      pool.appendChild(b);
    });
  }
  reset();
  var rb = el('<button class="retry">Start this one again</button>');
  rb.onclick = function(){
    delete state.res[key(n,0)];
    var f = card.querySelector('.fb'); if(f) f.remove();
    reset(); updateCounter();
  };
  card.appendChild(rb);

  /* --- items 1 to 6: find the part by its name --- */
  var tcard = el('<div class="card"><div class="chead"><span class="num">2</span>'+
    '<span class="tag">Find the part</span></div>'+
    '<p class="q" id="tapQ"></p>'+ R3_TAP_HTML +'</div>');
  root.appendChild(tcard);
  var tq = tcard.querySelector('#tapQ');
  var ti = 0, missed = {};

  function ask(){
    if(ti >= R3_TAP.length){
      tq.innerHTML = 'All six parts found. This email has an attachment, an emoji and a reference number, and a short email to an office often has none of them.';
      return;
    }
    tq.innerHTML = 'Question '+(ti+1)+' of '+R3_TAP.length+'. Tap the <b>'+R3_TAP[ti].label+'</b> in this email.';
  }
  tcard.querySelectorAll('.tp').forEach(function(b){
    b.onclick = function(){
      if(ti >= R3_TAP.length) return;
      var want = R3_TAP[ti];
      var old = tcard.querySelector('.fb'); if(old) old.remove();
      if(b.dataset.p === want.p){
        b.classList.add('found'); b.disabled = true;
        record(n, 1+ti, !missed[ti]);
        tcard.appendChild(el('<div class="fb '+(missed[ti]?'info':'good')+'"><b>That is the '+want.label+'.</b>'+want.why+'</div>'));
        ti++; ask();
      } else {
        missed[ti] = true;
        b.classList.add('no');
        setTimeout(function(){ b.classList.remove('no'); }, 700);
        tcard.appendChild(el('<div class="fb bad"><b>That is the '+PART_NAMES[b.dataset.p]+'.</b>Try again. You are looking for the '+want.label+'.</div>'));
      }
    };
  });
  ask();

  /* --- items 7 to 12 --- */
  mcqCards(root, n, R3_MCQ, 7, 'Choose one');
}

/* ---------- 4. CHIPS ---------- */
function buildChips(root, n){
  R4.forEach(function(it, i){
    var inner = '<p class="q chipline">'+it.s[0]+'<b>____________</b>'+it.s[1]+'</p><div class="chips"></div>';
    var card = cardShell(i+1, 'Tap the word', inner);
    var chips = card.querySelector('.chips');
    it.opts.forEach(function(o, oi){
      var b = el('<button class="chip"></button>');
      b.textContent = o;
      b.onclick = function(){
        if(card.dataset.done) return;
        card.dataset.done = '1';
        var ok = (oi === it.a);
        b.classList.add(ok ? 'right' : 'wrong');
        chips.querySelectorAll('.chip').forEach(function(x, xi){
          x.disabled = true;
          if(xi === it.a) x.classList.add('right');
        });
        card.querySelector('.q').innerHTML = it.s[0]+'<b>'+it.opts[it.a]+'</b>'+it.s[1];
        record(n, i, ok);
        feedback(card, ok, it.why);
      };
      chips.appendChild(b);
    });
    root.appendChild(card);
  });
}

/* ---------- 5. WORD BANK ---------- */
function buildBank(root, n){
  var card = el('<div class="card"><div class="chead"><span class="tag">Tap a gap, then tap a word</span></div>'+
    '<div class="bank" id="bank"></div><div class="gaptext" id="gt"></div></div>');
  root.appendChild(card);
  var bank = card.querySelector('#bank'), gt = card.querySelector('#gt');
  var filled = {}, selGap = null, graded = false;

  gt.appendChild(el('<p><b>Dear Ms Redmond,</b></p>'));
  R5_TEXT.forEach(function(parts){
    var p = document.createElement('p');
    parts.forEach(function(bit){
      if(typeof bit === 'number'){
        var g = el('<button class="gap" data-g="'+bit+'">?</button>');
        g.onclick = function(){
          if(graded) return;
          if(filled[bit] !== undefined){
            var w = filled[bit];
            delete filled[bit];
            g.textContent = '?';
            bank.querySelector('[data-w="'+w+'"]').classList.remove('used');
          }
          gt.querySelectorAll('.gap').forEach(function(x){x.classList.remove('sel');});
          g.classList.add('sel'); selGap = bit;
        };
        p.appendChild(g);
      } else if(bit){
        p.appendChild(document.createTextNode(bit));
      }
    });
    gt.appendChild(p);
  });
  gt.appendChild(el('<p><b>Kind regards,</b><br><b>Tariq Haddad</b></p>'));

  R5_BANK.forEach(function(w, wi){
    var b = el('<button class="bw" data-w="'+wi+'"></button>');
    b.textContent = w;
    b.onclick = function(){
      if(graded || b.classList.contains('used')) return;
      var target = selGap;
      if(target === null || filled[target] !== undefined){
        target = null;
        for(var i=0;i<R5_ANS.length;i++){ if(filled[i] === undefined){ target = i; break; } }
      }
      if(target === null) return;
      filled[target] = wi;
      var g = gt.querySelector('[data-g="'+target+'"]');
      g.textContent = R5_ANS[target].cap ? (w.charAt(0).toUpperCase()+w.slice(1)) : w;
      g.classList.remove('sel');
      b.classList.add('used');
      selGap = null;
    };
    bank.appendChild(b);
  });

  var check = el('<button class="checkbtn">Check my answers</button>');
  check.onclick = function(){
    if(graded) return;
    var missing = false;
    for(var i=0;i<R5_ANS.length;i++){ if(filled[i] === undefined) missing = true; }
    if(missing){
      var f = card.querySelector('.fb'); if(f) f.remove();
      card.appendChild(el('<div class="fb info"><b>Not finished yet</b>Fill every gap, then check.</div>'));
      return;
    }
    graded = true;
    var right = 0, notes = [];
    for(var i=0;i<R5_ANS.length;i++){
      var chosen = R5_BANK[filled[i]];
      var ok = (chosen === R5_ANS[i].a);
      var g = gt.querySelector('[data-g="'+i+'"]');
      g.classList.add(ok ? 'right' : 'wrong');
      if(!ok){ g.textContent = R5_ANS[i].cap ? (R5_ANS[i].a.charAt(0).toUpperCase()+R5_ANS[i].a.slice(1)) : R5_ANS[i].a; }
      record(n, i, ok);
      if(ok){ right++; } else { notes.push('Gap '+(i+1)+': '+R5_ANS[i].a+'. '+R5_ANS[i].why); }
    }
    var f2 = card.querySelector('.fb'); if(f2) f2.remove();
    var msg = notes.length ? notes.join('<br>') : 'Every joining word is in the right place.';
    card.appendChild(el('<div class="fb '+(notes.length?'bad':'good')+'"><b>'+right+' correct out of 8</b>'+msg+'</div>'));
    check.disabled = true;
  };
  card.appendChild(check);
}

/* ---------- 6. TYPED ANSWERS ---------- */
function norm(s){ return String(s).toLowerCase().replace(/[^a-z0-9]/g,''); }
function buildTyped(root, n){
  root.appendChild(el('<div class="card"><div class="chead"><span class="tag">Read this email</span></div>'+R6_EMAIL+'</div>'));
  R6.forEach(function(it, i){
    var inner = '<p class="q">'+it.q+'</p><div class="ansrow">'+
      '<input class="tin" type="text" autocomplete="off" placeholder="Type your answer">'+
      '<button class="mini">Check</button>'+
      '<button class="hintbtn" title="Hint">?</button></div>';
    var card = cardShell(i+1, 'Type it', inner);
    var input = card.querySelector('.tin');
    var btn = card.querySelector('.mini');
    var hb = card.querySelector('.hintbtn');
    hb.onclick = function(){
      if(card.querySelector('.hintbox')) return;
      card.appendChild(el('<div class="hintbox"><b>Hint</b> '+it.hint+'</div>'));
    };
    function check(){
      if(card.dataset.done) return;
      var v = norm(input.value);
      if(!v) return;
      var ok = it.ok.some(function(a){ return norm(a) === v; });
      card.dataset.done = '1';
      input.classList.add(ok ? 'right' : 'wrong');
      input.readOnly = true; btn.disabled = true;
      record(n, i, ok);
      feedback(card, ok, ok ? 'That matches the email.' : 'The email says: <b>'+it.show+'</b>');
    }
    btn.onclick = check;
    input.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ check(); } });
    root.appendChild(card);
  });
}

/* ---------- 7. SUBJECT LINES ---------- */
function buildSubject(root, n){
  var card = el('<div class="card"><div class="chead"><span class="tag">Sort into two groups</span></div>'+
    '<p class="left" id="left"></p><div id="cardArea"></div>'+
    '<div class="bins"><button class="bin" data-g="1">Good subject line</button>'+
    '<button class="bin" data-g="0">Needs fixing</button></div></div>');
  root.appendChild(card);
  var area = card.querySelector('#cardArea'), left = card.querySelector('#left');
  var idx = 0;

  function show(){
    var f = card.querySelector('.fb'); if(f) f.remove();
    if(idx >= R7_SORT.length){
      area.innerHTML = '';
      left.textContent = 'All six done.';
      card.querySelectorAll('.bin').forEach(function(b){ b.disabled = true; b.style.opacity = .4; });
      return;
    }
    left.textContent = 'Subject line '+(idx+1)+' of '+R7_SORT.length;
    area.innerHTML = '';
    area.appendChild(el('<div class="sortcard">Subject: '+R7_SORT[idx].t+'</div>'));
  }
  card.querySelectorAll('.bin').forEach(function(b){
    b.onclick = function(){
      if(idx >= R7_SORT.length) return;
      var it = R7_SORT[idx];
      var ok = ((b.dataset.g === '1') === it.good);
      record(n, idx, ok);
      var f = card.querySelector('.fb'); if(f) f.remove();
      card.appendChild(el('<div class="fb '+(ok?'good':'bad')+'"><b>'+
        (ok ? 'Correct.' : 'Not this time. This one '+(it.good?'works well.':'needs fixing.'))+'</b>'+it.why+'</div>'));
      idx++;
      setTimeout(show, 900);
    };
  });
  show();

  mcqCards(root, n, R7_MCQ, 6, 'Choose the best one');
}

/* ---------- 8. FIX THE EMAIL ---------- */
function buildFix(root, n){
  var card = el('<div class="card"><div class="chead"><span class="tag">Tap the problems</span></div>'+
    '<p class="q">This is a draft email to the office. Five lines have a problem. Tap those five lines, then check.</p>'+
    '<div class="lines" id="lines"></div></div>');
  root.appendChild(card);
  var box = card.querySelector('#lines');
  var picked = {}, graded = false;

  R8_LINES.forEach(function(l, i){
    var b = el('<button class="hline" data-i="'+i+'"></button>');
    b.textContent = l.t;
    b.onclick = function(){
      if(graded) return;
      if(picked[i]){ delete picked[i]; b.classList.remove('pick'); }
      else { picked[i] = true; b.classList.add('pick'); }
    };
    box.appendChild(b);
  });

  var check = el('<button class="checkbtn">Check the five problems</button>');
  check.onclick = function(){
    if(graded) return;
    graded = true;
    var found = 0, notes = [], badIdx = 0;
    R8_LINES.forEach(function(l, i){
      var b = box.querySelector('[data-i="'+i+'"]');
      b.classList.remove('pick');
      if(l.bad){
        var got = !!picked[i];
        b.classList.add(got ? 'ok' : 'no');
        record(n, badIdx, got);
        if(got){ found++; } else { notes.push('Missed: '+l.why); }
        badIdx++;
      } else if(picked[i]){
        b.classList.add('no');
        notes.push('That line is fine: '+l.why);
      }
    });
    card.appendChild(el('<div class="fb '+(found===5?'good':'bad')+'"><b>You found '+found+' problems out of 5</b>'+
      (notes.length ? notes.join('<br>') : 'Every problem found.')+'</div>'));
    check.disabled = true;
    var key2 = el('<div class="fb info"><b>The five problems</b>'+
      R8_LINES.filter(function(l){return l.bad;}).map(function(l){return l.why;}).join('<br>')+'</div>');
    card.appendChild(key2);
  };
  card.appendChild(check);

  mcqCards(root, n, R8_MCQ, 5, 'Now fix it');
}

/* ---------- results ---------- */
function renderResults(){
  var right = rightAll(), done = answeredAll();
  var pct = TOTAL ? Math.round(right / TOTAL * 100) : 0;
  var stars = pct >= 90 ? 5 : pct >= 75 ? 4 : pct >= 60 ? 3 : pct >= 40 ? 2 : 1;
  var band = pct >= 90 ? 'Excellent work. You are ready to write emails on your own.'
           : pct >= 75 ? 'Very good. Look again at the parts with the lowest score.'
           : pct >= 60 ? 'Good work. Try the weaker parts one more time.'
           : pct >= 40 ? 'Keep going. Read the green boxes again, then try the parts again.'
           : 'Do this revision again with a partner, and ask your teacher about the parts you find hard.';
  var box = el('<div class="res"><div class="big">'+right+' / '+TOTAL+'</div>'+
    '<div class="stars">'+ '\u2605'.repeat(stars) + '\u2606'.repeat(5-stars) +'</div>'+
    '<p>'+band+'</p><p class="sub">You answered '+done+' of '+TOTAL+' questions.</p>'+
    '<div class="brk" id="brk"></div></div>');
  main.appendChild(box);
  var brk = box.querySelector('#brk');
  var weak = [];
  ROUNDS.forEach(function(rd){
    var s = roundStats(rd.n);
    var cls = s.done === 0 ? '' : (s.right / rd.total >= 0.8 ? 'strong' : (s.right / rd.total < 0.6 ? 'weak' : ''));
    if(cls === 'weak' || s.done === 0){ weak.push(rd); }
    var row = el('<div class="brow '+cls+'"><span class="bn">Part '+rd.n+': '+rd.title+'</span>'+
      '<span class="bv">'+s.right+' / '+rd.total+'</span></div>');
    row.style.cursor = 'pointer';
    row.onclick = function(){ go(rd.n); };
    brk.appendChild(row);
  });
  if(weak.length){
    main.appendChild(el('<div class="fb info" style="margin-top:16px"><b>Look at these again</b>'+
      weak.map(function(w){return 'Part '+w.n+': '+w.title;}).join('<br>')+'</div>'));
  }
  var sa = el('<button class="retry" style="margin-top:16px">Start the whole revision again</button>');
  sa.onclick = function(){ state.res = {}; go('menu'); };
  main.appendChild(sa);
}

render();

</script>
